<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 特性演示 (简体中文)</title>
    <style>
        body { font-family: "Microsoft YaHei", Arial, sans-serif; line-height: 1.6; padding: 20px; }
        header, footer, section, nav, article, aside { border: 1px solid #ccc; margin-bottom: 15px; padding: 10px; border-radius: 5px; }
        header, footer { background-color: #f0f0f0; }
        .canvas-container { border: 1px dashed blue; padding: 5px; }
        .zoom-demo { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
        .zoom-stage { position: relative; width: 320px; height: 210px; overflow: hidden; border-radius: 10px; border: 1px solid #bbb; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
        .zoom-stage img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .zoom-icon { position: absolute; left: 120px; top: 75px; width: 48px; height: 48px; border-radius: 50%; border: 3px solid #fff; background: rgba(0, 130, 255, .85); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 2px 8px rgba(0,0,0,.35); cursor: grab; user-select: none; touch-action: none; }
        .zoom-icon:active { cursor: grabbing; }
        .zoom-preview { width: 220px; height: 160px; border: 1px solid #bbb; border-radius: 10px; background-image: url("html5.jpg"); background-repeat: no-repeat; background-size: 640px 420px; box-shadow: inset 0 0 0 3px rgba(0,130,255,.15); }
        .zoom-tip { margin-top: 8px; color: #555; }
    </style>
</head>
<body>

<header>
    <h1>HTML5 核心特性演示</h1>
    <nav>
        <ul>
            <li><a href="#media">多媒体</a></li>
            <li><a href="#form">表单增强</a></li>
            <li><a href="#storage">Web 存储</a></li>
        </ul>
    </nav>
</header>

<section id="media">
    <h2>多媒体与图形特性</h2>

    <article>
        <h3>📽️ 视频播放 (Video)</h3>
        <video width="320" height="240" controls>
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
            您的浏览器不支持 video 标签。
        </video>
    </article>

    <article>
        <h3>🎨 绘图 (Canvas)</h3>
        <div class="canvas-container">
            <canvas id="myCanvas" width="200" height="100" style="background-color: #eee;"></canvas>
        </div>
        <script>
            // 使用 JavaScript 在 Canvas 上绘图
            const canvas = document.getElementById('myCanvas');
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'red';
            ctx.fillRect(10, 10, 150, 80); // 绘制一个红色的矩形
        </script>
    </article>

    <article>
        <h3>🔎 图标移动上图放大</h3>
        <div class="zoom-demo">
            <div class="zoom-stage" id="zoomStage">
                <img src="html5.jpg" alt="HTML5 示例图片">
                <div class="zoom-icon" id="zoomIcon" role="button" aria-label="拖动图标查看局部放大">🔍</div>
            </div>
            <div>
                <strong>放大预览</strong>
                <div class="zoom-preview" id="zoomPreview" aria-label="图片局部放大预览"></div>
                <p class="zoom-tip">拖动蓝色放大镜图标，右侧会同步显示图标所在位置的 2 倍局部放大图。</p>
            </div>
        </div>
        <script>
            (function() {
                const stage = document.getElementById('zoomStage');
                const icon = document.getElementById('zoomIcon');
                const preview = document.getElementById('zoomPreview');
                const zoom = 2;
                let dragging = false;

                function moveIcon(clientX, clientY) {
                    const rect = stage.getBoundingClientRect();
                    const iconSize = icon.offsetWidth;
                    const maxX = rect.width - iconSize;
                    const maxY = rect.height - iconSize;
                    const left = Math.max(0, Math.min(clientX - rect.left - iconSize / 2, maxX));
                    const top = Math.max(0, Math.min(clientY - rect.top - iconSize / 2, maxY));
                    icon.style.left = left + 'px';
                    icon.style.top = top + 'px';
                    updatePreview(left + iconSize / 2, top + iconSize / 2, rect.width, rect.height);
                }

                function updatePreview(centerX, centerY, stageWidth, stageHeight) {
                    const previewWidth = preview.clientWidth;
                    const previewHeight = preview.clientHeight;
                    preview.style.backgroundSize = (stageWidth * zoom) + 'px ' + (stageHeight * zoom) + 'px';
                    preview.style.backgroundPosition =
                        (previewWidth / 2 - centerX * zoom) + 'px ' +
                        (previewHeight / 2 - centerY * zoom) + 'px';
                }

                icon.addEventListener('pointerdown', function(event) {
                    dragging = true;
                    icon.setPointerCapture(event.pointerId);
                    moveIcon(event.clientX, event.clientY);
                });

                icon.addEventListener('pointermove', function(event) {
                    if (dragging) {
                        moveIcon(event.clientX, event.clientY);
                    }
                });

                icon.addEventListener('pointerup', function(event) {
                    dragging = false;
                    icon.releasePointerCapture(event.pointerId);
                });

                updatePreview(144, 99, stage.clientWidth, stage.clientHeight);
            }());
        </script>
    </article>
</section>

<section id="form">
    <h2>表单增强特性</h2>
    <form onsubmit="alert('表单验证通过，尝试提交！'); return false;">
        <p>
            <label for="user_email">邮箱 (type="email", 内置验证):</label>
            <input type="email" id="user_email" required placeholder="请输入有效的邮箱">
            <span style="color:red;">* (必填)</span>
        </p>
        <p>
            <label for="birth_date">日期选择 (type="date"):</label>
            <input type="date" id="birth_date">
        </p>
        <p>
            <label for="quantity">数量 (type="number", 范围限制):</label>
            <input type="number" id="quantity" min="1" max="10" value="1">
        </p>
        <p>
            <label for="focus_me">自动聚焦 (autofocus):</label>
            <input type="text" id="focus_me" autofocus placeholder="页面加载时自动聚焦">
        </p>
        <button type="submit">提交表单</button>
    </form>
</section>

<aside>
    <h3>ℹ️ 附注信息</h3>
    <p>本侧边栏使用 <code>&lt;aside&gt;</code> 标签，通常用于放置与周围内容相关但又可独立的内容，比如广告、引用等。</p>
</aside>

<section id="storage">
    <h2>Web 存储 (LocalStorage)</h2>
    <button onclick="saveData()">保存数据</button>
    <button onclick="loadData()">读取数据</button>
    <p id="storage_status">状态：点击按钮进行操作。</p>

    <script>
        function saveData() {
            // 检查浏览器是否支持 Web Storage
            if (typeof(Storage) !== "undefined") {
                localStorage.setItem("username", "GeminiUserCN");
                document.getElementById("storage_status").textContent = "状态：数据 'GeminiUserCN' 已保存到 LocalStorage。";
            } else {
                document.getElementById("storage_status").textContent = "抱歉，您的浏览器不支持 Web Storage。";
            }
        }

        function loadData() {
            const username = localStorage.getItem("username");
            if (username) {
                document.getElementById("storage_status").textContent = "状态：从 LocalStorage 读取到数据：" + username;
            } else {
                document.getElementById("storage_status").textContent = "状态：LocalStorage 中没有找到 'username' 数据。";
            }
        }
    </script>
</section>

<footer>
    <p>&copy; 2025 HTML5 特性演示。版权所有。</p>
</footer>

</body>
</html>
